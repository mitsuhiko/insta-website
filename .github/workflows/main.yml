name: Deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Rebuild periodically so /changelog/ picks up CHANGELOG.md from mitsuhiko/insta
  # (fetched at build time via the fetch_github shortcode).
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [sync-changelog]
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@main
      - name: 'Fetch Installers'
        run: make fetch-installers
      - name: 'Build only' 
        uses: shalzz/zola-deploy-action@71190a69bbadd5fea222346d79b960e687e898ed
        env:
          BUILD_DIR: .
          BUILD_ONLY: true
  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@main
      - name: 'Fetch Installers'
        run: make fetch-installers
      - name: 'Build and deploy'
        uses: shalzz/zola-deploy-action@71190a69bbadd5fea222346d79b960e687e898ed
        env:
          PAGES_BRANCH: gh-pages
          BUILD_DIR: .
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
